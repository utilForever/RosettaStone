sonar.projectKey=RosettaStone
sonar.organization=utilforever-github

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=RosettaStone
sonar.projectVersion=0.4

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.exclusions=README.md,3RD-PARTY.md,Dockerfile,setup.py,Datas/**,Documents/**,Libraries/**,Resources/**,Scripts/**

# RosettaStone uses randomness only to simulate game mechanics, never for
# credentials, tokens, or other security-sensitive decisions.
sonar.issue.ignore.multicriteria=simulatorHeaders,simulatorSources,gameTests
sonar.issue.ignore.multicriteria.simulatorHeaders.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.simulatorHeaders.resourceKey=Includes/Rosetta/**/*
sonar.issue.ignore.multicriteria.simulatorSources.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.simulatorSources.resourceKey=Sources/Rosetta/**/*
sonar.issue.ignore.multicriteria.gameTests.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.gameTests.resourceKey=Tests/UnitTests/PlayMode/Games/GameTests.cpp

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
