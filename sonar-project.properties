sonar.projectKey=RosettaStone
sonar.organization=utilforever-github

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=RosettaStone
sonar.projectVersion=0.4

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.exclusions=README.md,3RD-PARTY.md,Dockerfile,setup.py,Datas/**,Documents/**,Libraries/**,Resources/**,Scripts/**

# Named exclusions are documented next to their rule and resource pairs below.
sonar.issue.ignore.multicriteria=simulatorHeaders,simulatorSources,gameTests,playModeCardNesting,playModeTaskNesting,battlegroundsTaskNesting,playModeCardComplexity,playModeTaskComplexity,battlegroundsTaskComplexity,auraBaseState,entityBaseState,taskBaseState,triggerBaseState,zoneInterfaceState,zoneBaseState,triggerHandlerIdentity,zoneOwnership,genericOwnership,auraOwnership,cardsOwnership,ongoingEnchantOwnership,cardLoaderOwnership,entityOwnership,heroOwnership,playerOwnership,copyTestOwnership,destroyTestOwnership,drawTestOwnership,transformCopyTestOwnership,testUtilsOwnership,cardPowersPrelude,cardTestsPrelude

# RosettaStone uses randomness only to simulate game mechanics, never for
# credentials, tokens, or other security-sensitive decisions.
sonar.issue.ignore.multicriteria.simulatorHeaders.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.simulatorHeaders.resourceKey=Includes/Rosetta/**/*
sonar.issue.ignore.multicriteria.simulatorSources.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.simulatorSources.resourceKey=Sources/Rosetta/**/*
sonar.issue.ignore.multicriteria.gameTests.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.gameTests.resourceKey=Tests/UnitTests/PlayMode/Games/GameTests.cpp

# Card/task dispatch mirrors game rules. Splitting it solely to satisfy generic
# nesting and complexity thresholds would obscure the flow.
# ponytail: extract helpers when a behavior change reveals a reusable boundary.
sonar.issue.ignore.multicriteria.playModeCardNesting.ruleKey=cpp:S134
sonar.issue.ignore.multicriteria.playModeCardNesting.resourceKey=Sources/Rosetta/PlayMode/CardSets/**/*
sonar.issue.ignore.multicriteria.playModeTaskNesting.ruleKey=cpp:S134
sonar.issue.ignore.multicriteria.playModeTaskNesting.resourceKey=Sources/Rosetta/PlayMode/Tasks/**/*
sonar.issue.ignore.multicriteria.battlegroundsTaskNesting.ruleKey=cpp:S134
sonar.issue.ignore.multicriteria.battlegroundsTaskNesting.resourceKey=Sources/Rosetta/Battlegrounds/Tasks/**/*
sonar.issue.ignore.multicriteria.playModeCardComplexity.ruleKey=cpp:S3776
sonar.issue.ignore.multicriteria.playModeCardComplexity.resourceKey=Sources/Rosetta/PlayMode/CardSets/**/*
sonar.issue.ignore.multicriteria.playModeTaskComplexity.ruleKey=cpp:S3776
sonar.issue.ignore.multicriteria.playModeTaskComplexity.resourceKey=Sources/Rosetta/PlayMode/Tasks/**/*
sonar.issue.ignore.multicriteria.battlegroundsTaskComplexity.ruleKey=cpp:S3776
sonar.issue.ignore.multicriteria.battlegroundsTaskComplexity.resourceKey=Sources/Rosetta/Battlegrounds/Tasks/**/*

# These PlayMode base classes expose protected extension state by design.
sonar.issue.ignore.multicriteria.auraBaseState.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.auraBaseState.resourceKey=Includes/Rosetta/PlayMode/Auras/Aura.hpp
sonar.issue.ignore.multicriteria.entityBaseState.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.entityBaseState.resourceKey=Includes/Rosetta/PlayMode/Models/Entity.hpp
sonar.issue.ignore.multicriteria.taskBaseState.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.taskBaseState.resourceKey=Includes/Rosetta/PlayMode/Tasks/ITask.hpp
sonar.issue.ignore.multicriteria.triggerBaseState.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.triggerBaseState.resourceKey=Includes/Rosetta/PlayMode/Triggers/Trigger.hpp
sonar.issue.ignore.multicriteria.zoneInterfaceState.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.zoneInterfaceState.resourceKey=Includes/Rosetta/PlayMode/Zones/IZone.hpp
sonar.issue.ignore.multicriteria.zoneBaseState.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.zoneBaseState.resourceKey=Includes/Rosetta/PlayMode/Zones/Zone.hpp

# Trigger handlers keep their registered identity on reassignment.
sonar.issue.ignore.multicriteria.triggerHandlerIdentity.ruleKey=cpp:S3624
sonar.issue.ignore.multicriteria.triggerHandlerIdentity.resourceKey=Includes/Rosetta/PlayMode/Managers/TriggerEventHandler.hpp

# PlayMode has legacy raw-pointer ownership boundaries that cannot be replaced
# safely piecemeal; tests intentionally exercise those same boundaries.
# ponytail: migrate an entire owner and its API together when that area changes.
sonar.issue.ignore.multicriteria.zoneOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.zoneOwnership.resourceKey=Includes/Rosetta/PlayMode/Zones/Zone.hpp
sonar.issue.ignore.multicriteria.genericOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.genericOwnership.resourceKey=Sources/Rosetta/PlayMode/Actions/Generic.cpp
sonar.issue.ignore.multicriteria.auraOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.auraOwnership.resourceKey=Sources/Rosetta/PlayMode/Auras/*.cpp
sonar.issue.ignore.multicriteria.cardsOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.cardsOwnership.resourceKey=Sources/Rosetta/PlayMode/Cards/Cards.cpp
sonar.issue.ignore.multicriteria.ongoingEnchantOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.ongoingEnchantOwnership.resourceKey=Sources/Rosetta/PlayMode/Enchants/OngoingEnchant.cpp
sonar.issue.ignore.multicriteria.cardLoaderOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.cardLoaderOwnership.resourceKey=Sources/Rosetta/PlayMode/Loaders/CardLoader.cpp
sonar.issue.ignore.multicriteria.entityOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.entityOwnership.resourceKey=Sources/Rosetta/PlayMode/Models/Entity.cpp
sonar.issue.ignore.multicriteria.heroOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.heroOwnership.resourceKey=Sources/Rosetta/PlayMode/Models/Hero.cpp
sonar.issue.ignore.multicriteria.playerOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.playerOwnership.resourceKey=Sources/Rosetta/PlayMode/Models/Player.cpp
sonar.issue.ignore.multicriteria.copyTestOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.copyTestOwnership.resourceKey=Tests/UnitTests/PlayMode/Actions/CopyTests.cpp
sonar.issue.ignore.multicriteria.destroyTestOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.destroyTestOwnership.resourceKey=Tests/UnitTests/PlayMode/Tasks/SimpleTasks/DestroyTaskTests.cpp
sonar.issue.ignore.multicriteria.drawTestOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.drawTestOwnership.resourceKey=Tests/UnitTests/PlayMode/Tasks/SimpleTasks/DrawTaskTests.cpp
sonar.issue.ignore.multicriteria.transformCopyTestOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.transformCopyTestOwnership.resourceKey=Tests/UnitTests/PlayMode/Tasks/SimpleTasks/TransformCopyTaskTests.cpp
sonar.issue.ignore.multicriteria.testUtilsOwnership.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.testUtilsOwnership.resourceKey=Tests/UnitTests/Utils/TestUtils.cpp

# These prelude headers intentionally export task names to card/test sources.
sonar.issue.ignore.multicriteria.cardPowersPrelude.ruleKey=cpp:S1003
sonar.issue.ignore.multicriteria.cardPowersPrelude.resourceKey=Includes/Rosetta/PlayMode/Cards/CardPowers.hpp
sonar.issue.ignore.multicriteria.cardTestsPrelude.ruleKey=cpp:S1003
sonar.issue.ignore.multicriteria.cardTestsPrelude.resourceKey=Tests/UnitTests/Utils/CardSetHeaders.hpp

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
